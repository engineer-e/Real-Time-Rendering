<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>
Emscripten File System Demo
</title>


<style>

body
{
    font-family: Arial;
    margin: 30px;
}


.box
{
    border:1px solid #ccc;
    padding:15px;
    margin-bottom:20px;
}


input[type="range"]
{
    width:300px;
}


textarea
{
    resize:none;
}


button
{
    padding:8px 15px;
    margin:5px;
}


pre
{
    background:#eeeeee;
    padding:15px;
    height:250px;
    overflow:auto;
}


</style>

</head>



<body>


<h2>
Emscripten C++ Browser File Demo
</h2>





<div class="box">

<h3>
Slider
</h3>


<input
type="range"
id="slider"
min="0"
max="100"
value="50"
oninput="sliderChanged(this.value)"
>


<p>
Value:
<span id="sliderValue">
50
</span>
</p>


</div>







<div class="box">

<h3>
Checkbox
</h3>


<label>

<input
type="checkbox"
id="checkbox"
onchange="checkboxChanged()"
>

Enable Feature

</label>


</div>







<div class="box">

<h3>
Text Input
</h3>


<input
type="text"
id="message"
placeholder="Enter text"
>


<button onclick="sendButton()">
Send To C++
</button>


</div>







<div class="box">

<h3>
Textarea
</h3>


<textarea
id="textarea"
rows="6"
cols="50"
placeholder="Enter multiple lines">
</textarea>


<br>


<button onclick="sendTextarea()">
Send Textarea
</button>


</div>








<div class="box">

<h3>
IDBFS File System
</h3>


<input
type="text"
id="fileText"
placeholder="Text to save"
>


<button onclick="writeFile()">
Append Write
</button>



<button onclick="readFile()">
Read File
</button>



<br><br>



<input
type="file"
id="fileInput"
>


<button onclick="importFile()">
Import File
</button>



<button onclick="exportFile()">
Download output.txt
</button>


</div>







<h3>
C++ Output
</h3>


<pre id="output"></pre>









<script>


let sliderValue = 50;

let checkboxValue = 0;






var Module =
{


print:function(text)
{
    document
    .getElementById("output")
    .textContent += text + "\n";
},



printErr:function(text)
{
    document
    .getElementById("output")
    .textContent += text + "\n";
},




onRuntimeInitialized:function()
{

    console.log("WASM Ready");


    Module._init_fs();


    Module._set_slider_value(50);


    Module._set_checkbox_value(0);

}


};









function sliderChanged(value)
{

    sliderValue=value;


    document
    .getElementById("sliderValue")
    .textContent=value;


    Module._set_slider_value(
        Number(value)
    );

}








function checkboxChanged()
{

    let box =
    document.getElementById("checkbox");


    checkboxValue =
    box.checked ? 1 : 0;



    Module._set_checkbox_value(
        checkboxValue
    );

}









function sendButton()
{

    let text =
    document.getElementById("message").value;


    let ptr =
    Module.stringToNewUTF8(text);



    Module._button_click(ptr);



    Module._free(ptr);

}









function sendTextarea()
{

    let text =
    document.getElementById("textarea").value;


    let ptr =
    Module.stringToNewUTF8(text);



    Module._textarea_input(ptr);



    Module._free(ptr);

}









function writeFile()
{

    let text =
    document.getElementById("fileText").value;



    let ptr =
    Module.stringToNewUTF8(text);



    Module._write_file(ptr);



    Module._free(ptr);

}









function readFile()
{

    document
    .getElementById("output")
    .textContent="";


    Module._read_file();

}









function importFile()
{

    let file =
    document
    .getElementById("fileInput")
    .files[0];



    if(!file)
    {
        alert("Select a file first");
        return;
    }



    let reader =
    new FileReader();



    reader.onload=function(e)
    {

        let ptr =
        Module.stringToNewUTF8(
            e.target.result
        );



        Module._import_file(ptr);



        Module._free(ptr);

    };



    reader.readAsText(file);

}









function exportFile()
{

    let ptr =
    Module._export_file();



    let text =
    UTF8ToString(ptr);



    let blob =
    new Blob(
        [text],
        {
            type:"text/plain"
        }
    );



    let link =
    document.createElement("a");



    link.href =
    URL.createObjectURL(blob);



    link.download =
    "output.txt";



    link.click();


}






</script>



<script src="Ch0_F.js"></script>



</body>

</html>
