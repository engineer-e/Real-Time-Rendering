<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>
Emscripten Slider Checkbox Demo
</title>


<style>

body
{
    font-family:Arial;
    margin:30px;
}


input[type=range]
{
    width:300px;
}


button
{
    margin-top:15px;
    padding:8px;
}


pre
{
    background:#eeeeee;
    padding:10px;
    height:250px;
    overflow:auto;
}


</style>


</head>


<body>


<h2>
Emscripten Controls Demo
</h2>



<h3>
Slider
</h3>


<input
type="range"
id="slider"
min="0"
max="100"
value="50"
oninput="sliderChanged(this.value)"
>


<p>
Value:
<span id="sliderValue">
50
</span>
</p>




<h3>
Checkbox
</h3>


<label>

<input
type="checkbox"
id="checkbox"
onchange="checkboxChanged()"
>

Enable Feature

</label>



<br><br>


<button onclick="saveData()">
Write Values
</button>


<button onclick="readData()">
Read File
</button>



<pre id="output"></pre>



<script>


let sliderValue = 50;

let checkboxValue = 0;



var Module =
{


print:function(text)
{
    document.getElementById("output").textContent += text+"\n";
},


printErr:function(text)
{
    document.getElementById("output").textContent += text+"\n";
},


onRuntimeInitialized:function()
{

    console.log("Runtime Ready");


    Module._init_fs();


    Module._set_slider_value(50);


    Module._set_checkbox_value(0);

}


};





function sliderChanged(value)
{

    sliderValue = value;


    document.getElementById("sliderValue").textContent=value;


    Module._set_slider_value(Number(value));

}






function checkboxChanged()
{

    let box=document.getElementById("checkbox");


    if(box.checked)
    {
        checkboxValue=1;
    }
    else
    {
        checkboxValue=0;
    }


    Module._set_checkbox_value(checkboxValue);

}






function saveData()
{

    let text =
    "Slider="
    +sliderValue
    +" Checkbox="
    +checkboxValue;



    let ptr =
    Module.stringToNewUTF8(text);



    Module._write_file(ptr);


    Module._free(ptr);

}






function readData()
{

    document.getElementById("output").textContent="";


    Module._read_file();

}


</script>



<script src="Ch0_F.js"></script>


</body>

</html>
