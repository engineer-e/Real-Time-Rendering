<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ray Tracing Pipeline</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

// Viewer camera
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.set(4,3,8);

// Renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);

// Light
const light = new THREE.PointLight(0xffffff,1);
light.position.set(5,5,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,0.5));

// ------------------------------------------------
// CAMERA POINT (ray origin)
// ------------------------------------------------
const rayOrigin = new THREE.Mesh(
    new THREE.SphereGeometry(0.15,32,32),
    new THREE.MeshBasicMaterial({color:0xffff00})
);
scene.add(rayOrigin);

// ------------------------------------------------
// VIEWPORT
// ------------------------------------------------
const viewportWidth = 4;
const viewportHeight = 2.25;

const viewport = new THREE.Mesh(
    new THREE.PlaneGeometry(viewportWidth,viewportHeight),
    new THREE.MeshBasicMaterial({
        color:0xffffff,
        wireframe:true
    })
);

viewport.position.z = -2;
scene.add(viewport);

// ------------------------------------------------
// PIXELS
// ------------------------------------------------
const cols = 20;
const rows = 12;
const pixels = [];

for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){

        const px =
            -viewportWidth/2 + (x/(cols-1))*viewportWidth;

        const py =
            viewportHeight/2 - (y/(rows-1))*viewportHeight;

        const pixel = new THREE.Mesh(
            new THREE.SphereGeometry(0.04),
            new THREE.MeshBasicMaterial({color:0xff0000})
        );

        pixel.position.set(px,py,-2);

        scene.add(pixel);
        pixels.push(pixel);
    }
}

// ------------------------------------------------
// OBJECT
// ------------------------------------------------
const objectSphere = new THREE.Mesh(
    new THREE.SphereGeometry(1,32,32),
    new THREE.MeshPhongMaterial({color:0x00ff00})
);

objectSphere.position.set(0,0,-6);
scene.add(objectSphere);

// ------------------------------------------------
// AXIS
// ------------------------------------------------
scene.add(new THREE.AxesHelper(5));

// ------------------------------------------------
// ACTIVE RAY
// ------------------------------------------------
let rayLine;

function drawRay(pixel){

    if(rayLine){
        scene.remove(rayLine);
    }

    const points = [
        rayOrigin.position.clone(),
        pixel.position.clone(),
        objectSphere.position.clone()
    ];

    const geometry =
        new THREE.BufferGeometry().setFromPoints(points);

    rayLine = new THREE.Line(
        geometry,
        new THREE.LineBasicMaterial({
            color:0x00ffff
        })
    );

    scene.add(rayLine);
}

// ------------------------------------------------
// ANIMATION
// ------------------------------------------------
let current = 0;

function scan(){

    pixels.forEach(p=>{
        p.material.color.set(0xff0000);
    });

    const pixel = pixels[current];
    pixel.material.color.set(0xffff00);

    drawRay(pixel);

    current++;

    if(current >= pixels.length){
        current = 0;
    }
}

setInterval(scan,200);

// ------------------------------------------------
// RENDER LOOP
// ------------------------------------------------
function animate(){

    requestAnimationFrame(animate);

    controls.update();
    renderer.render(scene,camera);
}

animate();

// Resize
window.addEventListener("resize",()=>{

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>

</body>
</html>
